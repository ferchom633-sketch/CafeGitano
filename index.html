<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CafeGitano</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <div class="hero-content">
            <h1>CafeGitano</h1>
            <p>El mejor café de la ciudad</p>
        </div>
    </header>

    <section id="productos">
        <h2>Productos</h2>
        <div class="product-grid">
            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80" alt="Café Americano">
                <div class="product-info">
                    <h3>Café Americano</h3>
                    <p>$2.00</p>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80" alt="Capuchino">
                <div class="product-info">
                    <h3>Capuchino</h3>
                    <p>$3.00</p>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=800&q=80" alt="Latte">
                <div class="product-info">
                    <h3>Latte</h3>
                    <p>$3.50</p>
                </div>
            </article>
        </div>
    </section>

    <section id="horarios">
        <h2>Horarios</h2>
        <p>Lunes a Viernes: 8:00 - 20:00</p>
        <p>Sábados: 9:00 - 18:00</p>
    </section>

    <section id="contacto">
        <h2>Contacto</h2>
        <p>Teléfono: 555-1234</p>
        <p>Email: hola@cafegitano.com</p>
    </section>
</body>
</html>
